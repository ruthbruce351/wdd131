<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Us">
    <meta name="author" content="Ruth (Bruce) Blake">
    <title>Contact Us</title>
    <link rel="stylesheet" href="styles/blake-family-travels.css">
    <script src="scripts/blake-family-travels.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Blake Family Travels</h1>
            <div class="topnav">
                <span class="icon" onclick="toggleMenu()">
                    <i class="fa fa-bars"></i>
                </span>
                <nav id="navbar">
                    <ul id="myLinks">
                        <li><a href="blake-family-travels.html">Home</a></li>
                        <li><a href="blake-blog.html">Blog</a></li>
                        <li><a href="blake-photos.html">Photo Album</a></li>
                        <li><a href="contact-us.html">Contact Us</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    
    <main>
        <form id="contactForm" onsubmit="handleSubmit(event)">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </main>

    <footer>
        <p>©<span id="currentyear"></span> | Ruth (Bruce) Blake | Texas, USA</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
